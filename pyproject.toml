[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vinted-arb"
version = "0.1.0"
description = "Radar de oportunidades de arbitraje de electrónica en Vinted frente al mercado secundario."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "curl_cffi>=0.11",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[project.scripts]
vinted-arb = "vinted_arb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not live'"
markers = [
    "live: tests de contrato contra Vinted real (red necesaria; ejecutar con -m live)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]
ignore = ["RUF001", "RUF002", "RUF003"]  # el código y los comentarios están en español (acentos, «», etc.)

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["vinted_arb"]

[[tool.mypy.overrides]]
module = ["curl_cffi.*"]
ignore_missing_imports = true
